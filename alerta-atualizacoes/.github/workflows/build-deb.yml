name: Build Debian package

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-26.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential cmake debhelper devscripts dpkg-dev fakeroot \
            lintian ninja-build qt6-base-dev qt6-svg-dev \
            liblayershellqtinterface-dev sudo

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Validate sudoers source
        run: visudo -cf data/system-upgrade.sudoers

      - name: Build Debian package
        run: dpkg-buildpackage -us -uc -b

      - name: Validate package
        run: |
          package=$(find .. -maxdepth 1 -name 'system-upgrade_*_amd64.deb' -print -quit)
          scripts/validate-package.sh "$package"
          changes=$(find .. -maxdepth 1 -name 'system-upgrade_*_amd64.changes' -print -quit)
          lintian --fail-on error "$changes"

      - name: Prepare artifacts
        run: |
          mkdir -p dist
          cp ../system-upgrade_*_amd64.deb dist/
          cd dist
          sha256sum ./*.deb > SHA256SUMS

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: system-upgrade-deb
          path: |
            dist/*.deb
            dist/SHA256SUMS
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write

    steps:
      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: system-upgrade-deb
          path: dist

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* --generate-notes --title "$GITHUB_REF_NAME"
          fi
